name: Raven - testes e qualidade das ofertas
on:
  push:
    paths:
      - '**.js'
      - '**.mjs'
      - '**.json'
      - '**.html'
      - 'tools/**'
      - '.github/workflows/raven-quality.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de compatibilidade
        run: node compatibility.test.mjs
      - name: Testes de segurança de ofertas
        run: node tools/offer-policy.test.mjs
      - name: Testar filtros de catálogo 6.4
        run: node tools/catalog-filters.test.mjs
      - name: Testar importação segura do robô 6.5
        run: node tools/offer-import65.test.mjs
      - name: Testar integrações Raven 6.7–7.0
        run: node tools/raven70.test.mjs
      - name: Testar RAM SSD HD e fontes no Montador 7.1
        run: node tools/builder-published-parts.test.mjs
      - name: Testar ferramentas Raven 7.2–7.9
        run: node tools/raven79.test.mjs
      - name: Testar Raven 8.0 a 9.0
        run: node tools/raven90.test.mjs
      - name: Testar visibilidade de anúncios por categoria e por loja
        run: node tools/catalog-display.test.mjs
      - name: Verificar ofertas publicadas
        run: node tools/audit-offers.mjs --strict
      - name: Verificar links internos e sintaxe
        run: node tools/site-sanity.mjs
